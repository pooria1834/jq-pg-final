name: PatchGuard

on:
  pull_request:

permissions:
  contents: read

jobs:
  patchguard:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]' || !startsWith(github.head_ref, 'patchguard/regressions-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build exact baseline snapshot from PR base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          rm -rf .patchguard/base
          mkdir -p .patchguard/base
          git archive "$BASE_SHA" jq-src | tar -x -C .patchguard/base --strip-components=1
          test -f .patchguard/base/PGMakefile
          test -f jq-src/PGMakefile
          echo "PATCHGUARD_BASE_REVISION=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Run PatchGuard
        id: patchguard
        uses: pooria1834/PatchGuard@5dabe1e0c85482e29cefec6238a31e6bdaa4e463
        with:
          config: .patchguard/config.yaml
          report-dir: artifacts/patchguard
          auto-regression-pr: 'false'

      - name: Upload evidence even for a failing patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patchguard-pr-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/patchguard/summary.md
            artifacts/patchguard/verdict.json
            artifacts/patchguard/report.json
            artifacts/patchguard/evidence-index.md
            artifacts/patchguard/evidence-index.json
            artifacts/patchguard/regression-candidates.md
            artifacts/patchguard/technical-evidence.zip
